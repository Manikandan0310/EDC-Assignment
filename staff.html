<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDC Assignment – Staff</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667;--ac:#1d6fd8;--bd:#d8dce2;--ok:#1a7f45}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ad;--ac:#5aa2ff;--bd:#343a42;--ok:#4cc27f}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:720px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
input,select,textarea,button{font:inherit;width:100%;padding:9px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}.tabs{display:flex;gap:8px}.tabs button{width:auto;flex:1}
.th{display:flex;flex-wrap:wrap;gap:6px}.th img{width:70px;height:90px;object-fit:cover;border-radius:6px}
.hid{display:none}.mu{color:var(--mu);font-size:13px}.big{font-size:32px;font-weight:700;color:var(--ok)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}
.tw{overflow-x:auto}h1{font-size:20px}label{font-size:13px;color:var(--mu)}
</style></head><body><main>
<h1>Electronic Devices &amp; Circuits – Staff Panel</h1>
<section>
 <div class="card"><label>Staff passcode</label><input id="pw" type="password">
  <label>Load existing assignment</label><select id="ld"><option value="">— new —</option></select>
  <button class="s" id="ldb">Load</button>
  <label>Assignment ID (e.g. EDC-A1)</label><input id="kid"><label>Title</label><input id="kt"></div>
 <div id="qs"></div>
 <button class="s" id="aq">+ Add question</button><button id="sv">Save answer key</button>
 <div id="smsg" class="mu"></div>
 <div class="card"><button class="s" id="vs">View submissions</button><div class="tw"><table id="st"></table></div></div>
</section>
</main>
<script>
const API = "https://script.google.com/macros/s/AKfycbwvqeU2eAX6csrld9VCnOFdgQaQGAvVUTntlu7ti8qRnfbRgtaKBiXvUzmBVWS-S0OL/exec";

const $ = id => document.getElementById(id);
const call = async b => { const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(b)}); const j = await r.json(); if (j.error) throw new Error(j.error); return j; };
async function compress(file, max = 1600) {
  const b = await createImageBitmap(file), k = Math.min(1, max / Math.max(b.width, b.height));
  const c = document.createElement("canvas"); c.width = b.width * k; c.height = b.height * k;
  c.getContext("2d").drawImage(b, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", .82);
}

// ---------- Staff ----------
let Q = [];
fetch(API).then(r => r.json()).then(j => { $("ld").innerHTML += j.assignments.map(a => `<option value="${a.id}">${a.title}</option>`).join(""); });
const blank = () => ({text:"", kw:"", diagramMarks:0, refImage:null, diagramFile:null});
function draw() {
  $("qs").innerHTML = Q.map((q, i) => `<div class="card"><b>Question ${i + 1}</b>
   <label>Question text</label><input data-i="${i}" data-f="text" value="${q.text.replace(/"/g, "&quot;")}">
   <label>Keywords &amp; mark split – one per line: <code>term | alternative = marks</code> (e.g. <code>Early effect | base width modulation = 1.5</code>)</label>
   <textarea rows="5" data-i="${i}" data-f="kw">${q.kw}</textarea>
   <label>Marks for circuit diagram (0 if none)</label><input type="number" step="0.5" data-i="${i}" data-f="diagramMarks" value="${q.diagramMarks}">
   <label>Reference circuit image ${q.diagramFile ? "(saved ✔)" : ""}</label><input type="file" accept="image/*" data-i="${i}" data-f="ref">
   <button class="s" data-del="${i}">Remove</button></div>`).join("");
}
$("qs").oninput = async e => { const t = e.target, i = t.dataset.i; if (i == null) return;
  if (t.dataset.f === "ref") Q[i].refImage = t.files[0] ? await compress(t.files[0], 1200) : null; else Q[i][t.dataset.f] = t.value; };
$("qs").onclick = e => { if (e.target.dataset.del != null) { Q.splice(e.target.dataset.del, 1); draw(); } };
$("aq").onclick = () => { Q.push(blank()); draw(); };
$("ldb").onclick = async () => { if (!$("ld").value) { Q = [blank()]; draw(); return; }
  try { const k = (await call({action:"getKey", pass:$("pw").value, id:$("ld").value})).key; $("kid").value = k.id; $("kt").value = k.title;
    Q = k.questions.map(q => ({text:q.text, diagramMarks:q.diagramMarks || 0, diagramFile:q.diagramFile, refImage:null,
      kw:q.keywords.map(x => x.terms.join(" | ") + " = " + x.marks).join("\n")})); draw(); } catch (e) { $("smsg").textContent = e.message; } };
$("sv").onclick = async () => {
  try {
    const questions = Q.map(q => ({text:q.text, diagramMarks:+q.diagramMarks || 0, refImage:q.refImage, diagramFile:q.diagramFile,
      keywords:q.kw.split("\n").filter(l => l.includes("=")).map(l => { const [a, m] = l.split("="); return {terms:a.split("|").map(s => s.trim()).filter(Boolean), marks:+m}; })}));
    await call({action:"saveKey", pass:$("pw").value, id:$("kid").value.trim(), title:$("kt").value.trim(), questions});
    $("smsg").textContent = "Saved ✔ (reload page to see it in the student list)";
  } catch (e) { $("smsg").textContent = e.message; }
};
$("vs").onclick = async () => {
  try { const r = (await call({action:"subs", pass:$("pw").value})).rows;
    $("st").innerHTML = r.map((x, i) => `<tr>${[0, 1, 2, 3, 4, 5, 6].map(c => i ? `<td>${c ? x[c] : new Date(x[c]).toLocaleString()}</td>` : `<th>${x[c]}</th>`).join("")}</tr>`).join(""); }
  catch (e) { $("smsg").textContent = e.message; }
};
</script></body></html>
