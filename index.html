<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDC Assignment – Student</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667;--ac:#1d6fd8;--bd:#d8dce2;--ok:#1a7f45}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e8eaed;--mu:#9aa3ad;--ac:#5aa2ff;--bd:#343a42;--ok:#4cc27f}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:720px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
input,select,button{font:inherit;width:100%;padding:9px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer;font-weight:600}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.5}.row{display:flex;gap:8px}.row>*{flex:1}
.th{display:flex;flex-wrap:wrap;gap:8px}.th div{position:relative}.th img{width:74px;height:96px;object-fit:cover;border-radius:6px;display:block}
.th b{position:absolute;top:-6px;right:-6px;background:#d33;color:#fff;border-radius:50%;width:20px;height:20px;text-align:center;line-height:20px;cursor:pointer}
.hid{display:none}.mu{color:var(--mu);font-size:13px}.big{font-size:32px;font-weight:700;color:var(--ok)}
video,#pv{width:100%;max-height:65vh;object-fit:contain;background:#000;border-radius:8px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}
h1{font-size:20px}label{font-size:13px;color:var(--mu)}input[type=range]{padding:0;margin:2px 0 8px}
</style></head><body><main>
<h1>EDC Assignment Submission</h1>

<div class="card">
 <label>Assignment</label><select id="asg"></select>
 <label>Name</label><input id="nm"><label>Register number</label><input id="rg" inputmode="numeric">
 <div class="row"><button id="oc">📷 Open camera</button><button class="s" id="ug">🖼 Upload from gallery</button></div>
 <input id="gal" type="file" accept="image/*" multiple class="hid">
 <div class="th" id="th"></div>
 <button id="ev" class="hid">Evaluate</button>
 <div id="msg" class="mu"></div>
</div>

<div class="card hid" id="cam"><video id="vid" playsinline muted></video>
 <div class="row"><button id="snap">Capture</button><button class="s" id="cc">Close camera</button></div>
 <div class="mu">Place the page flat, fill the frame, avoid shadows.</div></div>

<div class="card hid" id="ed"><canvas id="pv"></canvas>
 <div class="row" id="modes" style="margin-top:8px">
  <button class="s" data-m="scan">Scan</button><button class="s" data-m="bw">B&amp;W</button>
  <button class="s" data-m="gray">Gray</button><button class="s" data-m="orig">Original</button></div>
 <label>Brightness</label><input type="range" id="br" min="-80" max="80" value="0">
 <label>Contrast</label><input type="range" id="ct" min="0.6" max="2" step="0.05" value="1">
 <div class="row"><button class="s" id="rot">⟳ Rotate</button><button class="s" id="dis">Discard</button><button id="use">Use page</button></div></div>

<div class="card hid" id="res"><div class="big" id="tot"></div><div id="pend" class="mu"></div>
 <div style="overflow-x:auto"><table id="bd"></table></div><button id="sub">Submit assignment</button></div>
</main>
<script>
const API = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";
const $ = id => document.getElementById(id);
const call = async b => { const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain"}, body:JSON.stringify(b)}); const j = await r.json(); if (j.error) throw new Error(j.error); return j; };
let photos = [], evalId = null, stream = null, queue = [], src = null, mode = "scan";

fetch(API).then(r => r.json()).then(j => { $("asg").innerHTML = j.assignments.map(a => `<option value="${a.id}">${a.title}</option>`).join(""); })
  .catch(() => $("msg").textContent = "Could not load assignments.");

// ---- helpers ----
function toCanvas(el, w, h, max = 1600) {
  const k = Math.min(1, max / Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext("2d").drawImage(el, 0, 0, c.width, c.height); return c;
}
function boxMean(g, w, h, r) {
  const W = w + 1, I = new Float64Array(W * (h + 1));
  for (let y = 0; y < h; y++) { let s = 0; for (let x = 0; x < w; x++) { s += g[y * w + x]; I[(y + 1) * W + x + 1] = I[y * W + x + 1] + s; } }
  const o = new Float32Array(w * h);
  for (let y = 0; y < h; y++) { const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
    for (let x = 0; x < w; x++) { const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
      o[y * w + x] = (I[y1 * W + x1] - I[y0 * W + x1] - I[y1 * W + x0] + I[y0 * W + x0]) / ((y1 - y0) * (x1 - x0)); } }
  return o;
}
function proc(s, max) {
  const c = toCanvas(s, s.width, s.height, max), w = c.width, h = c.height, x = c.getContext("2d");
  const br = +$("br").value, ct = +$("ct").value;
  if (mode === "orig" && !br && ct === 1) return c;
  const im = x.getImageData(0, 0, w, h), d = im.data, n = w * h, g = new Float32Array(n);
  for (let i = 0; i < n; i++) g[i] = .299 * d[4 * i] + .587 * d[4 * i + 1] + .114 * d[4 * i + 2];
  const bg = (mode === "scan" || mode === "bw") ? boxMean(g, w, h, Math.max(15, w >> 4)) : null;
  const adj = v => Math.max(0, Math.min(255, (v - 128) * ct + 128 + br));
  for (let i = 0; i < n; i++) {
    if (mode === "orig") { for (let k = 0; k < 3; k++) d[4 * i + k] = adj(d[4 * i + k]); continue; }
    let v;
    if (mode === "scan") v = adj(Math.min(255, g[i] / Math.max(bg[i], 1) * 235));
    else if (mode === "bw") v = g[i] < bg[i] * .88 ? 0 : 255;
    else v = adj(g[i]);
    d[4 * i] = d[4 * i + 1] = d[4 * i + 2] = v;
  }
  x.putImageData(im, 0, 0); return c;
}

// ---- camera ----
$("oc").onclick = async () => {
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1920}}, audio:false});
    $("vid").srcObject = stream; await $("vid").play(); $("cam").classList.remove("hid"); }
  catch (e) { $("msg").textContent = "Camera not available (" + e.message + "). Use gallery upload."; }
};
const closeCam = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $("cam").classList.add("hid"); };
$("cc").onclick = closeCam;
$("snap").onclick = () => { const v = $("vid"); queue.push(toCanvas(v, v.videoWidth, v.videoHeight)); closeCam(); next(); };
$("ug").onclick = () => $("gal").click();
$("gal").onchange = async e => { for (const f of e.target.files) { const b = await createImageBitmap(f); queue.push(toCanvas(b, b.width, b.height)); } e.target.value = ""; next(); };

// ---- editor ----
function next() { if (!queue.length) { $("ed").classList.add("hid"); return; }
  src = queue.shift(); mode = "scan"; $("br").value = 0; $("ct").value = 1; $("ed").classList.remove("hid"); draw(); $("ed").scrollIntoView(); }
function draw() { const p = proc(src, 800), v = $("pv"); v.width = p.width; v.height = p.height; v.getContext("2d").drawImage(p, 0, 0);
  document.querySelectorAll("#modes button").forEach(b => b.className = b.dataset.m === mode ? "" : "s"); }
$("modes").onclick = e => { if (e.target.dataset.m) { mode = e.target.dataset.m; draw(); } };
$("br").oninput = $("ct").oninput = draw;
$("rot").onclick = () => { const c = document.createElement("canvas"); c.width = src.height; c.height = src.width; const x = c.getContext("2d");
  x.translate(c.width, 0); x.rotate(Math.PI / 2); x.drawImage(src, 0, 0); src = c; draw(); };
$("dis").onclick = next;
$("use").onclick = () => { photos.push(proc(src, 1600).toDataURL("image/jpeg", .85)); thumbs(); next(); };
function thumbs() {
  $("th").innerHTML = photos.map((p, i) => `<div><img src="${p}"><b data-i="${i}">×</b></div>`).join("");
  $("ev").classList.toggle("hid", !photos.length);
}
$("th").onclick = e => { if (e.target.dataset.i != null) { photos.splice(e.target.dataset.i, 1); thumbs(); } };

// ---- evaluate / submit ----
$("ev").onclick = async () => {
  if (!$("nm").value.trim() || !$("rg").value.trim()) return $("msg").textContent = "Enter name and register number first.";
  $("ev").disabled = true; $("msg").textContent = "Reading and evaluating pages… this can take a minute.";
  try {
    const j = await call({action:"evaluate", assignmentId:$("asg").value, reg:$("rg").value.trim(), images:photos});
    evalId = j.evalId; $("tot").textContent = `${j.got} / ${j.max - j.dPending}`;
    $("pend").textContent = j.dPending ? `+ ${j.dPending} marks for circuit diagrams will be given by staff.` : "";
    $("bd").innerHTML = "<tr><th>Question</th><th>Marks</th></tr>" + j.result.map(r => `<tr><td>${r.text}</td><td>${r.got}/${r.max}${r.diagram ? ` (+${r.diagram} diagram)` : ""}</td></tr>`).join("");
    $("res").classList.remove("hid"); $("msg").textContent = "";
  } catch (e) { $("msg").textContent = e.message; }
  $("ev").disabled = false;
};
$("sub").onclick = async () => {
  $("sub").disabled = true;
  try { await call({action:"submit", evalId, name:$("nm").value.trim(), reg:$("rg").value.trim()});
    $("res").innerHTML = "<div class='big'>✔ Submitted</div>"; $("ev").classList.add("hid"); }
  catch (e) { alert(e.message); $("sub").disabled = false; }
};
</script></body></html>
